<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="340" viewBox="0 0 1600 340" role="img" aria-label="Wenshi workflow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#f1eee5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b1b1b" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1600" height="340" fill="url(#bg)"/>
  <text x="80" y="64" fill="#171717" font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" font-size="30" font-weight="700">从提问到复盘</text>
  <text x="80" y="94" fill="#6f685c" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" letter-spacing="1">A COMPLETE LIUYAO PRACTICE LOOP</text>
  <rect x="80" y="112" width="64" height="4" rx="2" fill="#b8945a"/>

  <line x1="150" y1="210" x2="1450" y2="210" stroke="#d9d1c1" stroke-width="2"/>
  <g filter="url(#shadow)">
    <circle cx="190" cy="210" r="48" fill="#171717"/>
    <circle cx="470" cy="210" r="48" fill="#ffffff" stroke="#ded7c7"/>
    <circle cx="750" cy="210" r="48" fill="#ffffff" stroke="#ded7c7"/>
    <circle cx="1030" cy="210" r="48" fill="#ffffff" stroke="#ded7c7"/>
    <circle cx="1310" cy="210" r="48" fill="#ffffff" stroke="#ded7c7"/>
  </g>
  <g font-family="'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <text x="190" y="218" fill="#c9a66b">01</text>
    <text x="470" y="218" fill="#171717">02</text>
    <text x="750" y="218" fill="#171717">03</text>
    <text x="1030" y="218" fill="#171717">04</text>
    <text x="1310" y="218" fill="#171717">05</text>
  </g>
  <g font-family="'PingFang SC','Noto Sans SC','Helvetica Neue',sans-serif" text-anchor="middle">
    <text x="190" y="288" fill="#171717" font-size="19" font-weight="700">提问</text>
    <text x="470" y="288" fill="#171717" font-size="19" font-weight="700">起卦</text>
    <text x="750" y="288" fill="#171717" font-size="19" font-weight="700">分析</text>
    <text x="1030" y="288" fill="#171717" font-size="19" font-weight="700">保存</text>
    <text x="1310" y="288" fill="#171717" font-size="19" font-weight="700">验事与归档</text>
  </g>
  <g fill="#8b7a5e" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12" text-anchor="middle">
    <text x="190" y="312">QUESTION</text>
    <text x="470" y="312">CAST</text>
    <text x="750" y="312">ANALYZE</text>
    <text x="1030" y="312">SAVE</text>
    <text x="1310" y="312">REVIEW</text>
  </g>
</svg>
